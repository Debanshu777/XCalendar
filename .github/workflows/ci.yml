name: Kotlin Toolchain

on:
  pull_request:
  merge_group:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: toolchain-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            wrapper: ./kotlin
          - os: macos-latest
            wrapper: ./kotlin
          - os: windows-latest
            wrapper: .\kotlin.bat
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Verify toolchain and modules
        run: |
          ${{ matrix.wrapper }} --version
          ${{ matrix.wrapper }} show modules
      - name: Test build configuration and shared application
        run: ${{ matrix.wrapper }} test -m app-config -m desktop-distribution -m shared -p jvm
      - name: Build desktop application
        run: ${{ matrix.wrapper }} build -m desktopApp -p jvm
      - name: Package desktop application
        run: ${{ matrix.wrapper }} do packageDesktop -m desktopApp
      - name: Build and test Android
        if: runner.os == 'Linux'
        run: |
          ./kotlin build -m androidApp -p android
          ./kotlin test -m shared -p android
      - name: Build iOS simulator application
        if: runner.os == 'macOS'
        run: ./kotlin build -m iosApp -p iosSimulatorArm64
      - name: Test shared application on iOS simulator
        if: runner.os == 'macOS'
        run: ./kotlin test -m shared -p iosSimulatorArm64

  performance:
    name: Performance standards
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Test performance tooling and rejection paths
        run: python3 -m unittest discover -s scripts/performance -p 'test_*.py'
      - name: Validate measured performance evidence
        if: github.event_name != 'push'
        env:
          BASE_REV: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          HEAD_REV: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
          TESTED_REV: ${{ github.sha }}
        run: |
          BASE_DIGEST=$(python3 scripts/performance/source_digest.py "$BASE_REV")
          HEAD_DIGEST=$(python3 scripts/performance/source_digest.py "$HEAD_REV")
          TESTED_DIGEST=$(python3 scripts/performance/source_digest.py "$TESTED_REV")
          if [ "$HEAD_DIGEST" != "$TESTED_DIGEST" ]; then
            echo 'Update the PR branch with its base and measure the resulting source before merging.'
            exit 1
          fi
          git show "$HEAD_REV:performance-evidence/merge.json" > "$RUNNER_TEMP/performance-evidence.json"
          python3 scripts/performance/check_merge_evidence.py --report "$RUNNER_TEMP/performance-evidence.json" --base-source-sha256 "$BASE_DIGEST" --head-source-sha256 "$HEAD_DIGEST"

  merge-gate:
    name: Merge gate
    if: always()
    needs: [validate, performance]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every prerequisite to succeed
        env:
          VALIDATION_RESULT: ${{ needs.validate.result }}
          PERFORMANCE_RESULT: ${{ needs.performance.result }}
        run: |
          test "$VALIDATION_RESULT" = success
          test "$PERFORMANCE_RESULT" = success
